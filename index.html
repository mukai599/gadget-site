<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ガジェット紹介サイト</title>
<style>
    :root {
        --accent: #3f72af;
        --bg: #f4f6f8;
        --card-bg: #ffffff;
        --text: #222;
        --sub: #666;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
        background: var(--bg);
        color: var(--text);
    }
    header {
        background: var(--accent);
        color: #fff;
        padding: 32px 20px;
        text-align: center;
    }
    header h1 { margin: 0 0 8px; font-size: 24px; }
    header p { margin: 0; opacity: 0.9; font-size: 14px; }

    main {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px 16px 60px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 20px;
    }

    .card {
        background: var(--card-bg);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        display: flex;
        flex-direction: column;
    }
    .card-thumb {
        height: 140px;
        background: #e3e8ee;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
    }
    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .card-body h2 { margin: 0; font-size: 16px; }
    .card-body p { margin: 0; font-size: 13px; color: var(--sub); line-height: 1.5; }
    .price { margin-top: auto; font-weight: bold; color: var(--accent); font-size: 14px; }

    .note {
        margin: 24px 0;
        padding: 14px 16px;
        background: #fff8e1;
        border: 1px solid #ffe082;
        border-radius: 10px;
        font-size: 13px;
        color: #7a5b00;
    }

    footer {
        text-align: center;
        padding: 20px;
        font-size: 12px;
        color: var(--sub);
    }
</style>
</head>
<body>

<header>
    <h1>ガジェット紹介サイト</h1>
    <p>お気に入りのガジェットをまとめていくページ(仮)</p>
</header>

<main>
    <div class="note">
        これは仮のページです。ここに実際のガジェット情報・写真を追加していきます。
    </div>

    <div class="grid" id="gadget-grid">
        <div class="card">
            <div class="card-thumb">🎧</div>
            <div class="card-body">
                <h2>サンプルガジェットA</h2>
                <p>ここに特徴や感想を書きます。使ってみた印象、良かった点など。</p>
                <div class="price">¥0,000</div>
            </div>
        </div>
        <div class="card">
            <div class="card-thumb">⌨️</div>
            <div class="card-body">
                <h2>サンプルガジェットB</h2>
                <p>ここに特徴や感想を書きます。使ってみた印象、良かった点など。</p>
                <div class="price">¥0,000</div>
            </div>
        </div>
        <div class="card">
            <div class="card-thumb">📱</div>
            <div class="card-body">
                <h2>サンプルガジェットC</h2>
                <p>ここに特徴や感想を書きます。使ってみた印象、良かった点など。</p>
                <div class="price">¥0,000</div>
            </div>
        </div>
    </div>
</main>

<footer>
    © 2026 ガジェット紹介サイト
</footer>

</body>
</html>
